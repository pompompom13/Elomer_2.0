# ЭЛОМЕР + Caddy: Caddy выдаёт HTTPS-сертификат, спрашивает логин и пароль и только потом пускает к программе.
# Сама программа наружу не открыта — к ней можно попасть только через Caddy.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ../backend/data:/app/backend/data   # базы, проекты, загрузки — остаются на сервере между обновлениями

  caddy:
    image: mirror.gcr.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./users.caddy:/etc/caddy/users.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
